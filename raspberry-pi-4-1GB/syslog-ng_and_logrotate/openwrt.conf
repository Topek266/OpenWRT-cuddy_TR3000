# Odbieranie logów z OpenWRT
source s_openwrt {
    network(
      ip("192.168.50.106")
      transport("udp")
      port(514)
    );
};

# Zapisywanie logów do pliku
destination d_openwrt {
    file(
        "/var/log/openwrt/cudy.log"
        create-dirs(yes)
        perm(0640)
    );
};

# Połączenie źródła z miejscem zapisu
log {
    source(s_openwrt);
    destination(d_openwrt);
};
